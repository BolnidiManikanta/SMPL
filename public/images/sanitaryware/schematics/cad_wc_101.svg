<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FBF9F6"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#E2DACF" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Dimension Lines & Markers -->
  <!-- Top Width: 370 mm -->
  <line x1="120" y1="40" x2="280" y2="40" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="120" y1="35" x2="120" y2="45" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="280" y1="35" x2="280" y2="45" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="120,40 128,37 128,43" fill="#7A7067"/>
  <polygon points="280,40 272,37 272,43" fill="#7A7067"/>
  <text x="200" y="32" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600">370 mm</text>

  <!-- Left Height: 785 mm -->
  <line x1="55" y1="65" x2="55" y2="250" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="50" y1="65" x2="60" y2="65" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="50" y1="250" x2="60" y2="250" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="55,65 52,73 58,73" fill="#7A7067"/>
  <polygon points="55,250 52,242 58,242" fill="#7A7067"/>
  <text x="45" y="160" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600" transform="rotate(-90 45,160)">785 mm</text>

  <!-- Tank & Lid -->
  <rect x="135" y="65" width="130" height="95" rx="4" fill="#FFFFFF" stroke="#2D2823" stroke-width="2"/>
  <rect x="130" y="60" width="140" height="12" rx="3" fill="#FFFFFF" stroke="#2D2823" stroke-width="1.8"/>
  <circle cx="200" cy="66" r="4.5" fill="none" stroke="#7A7067" stroke-width="1.2"/>

  <!-- Bowl Contour -->
  <path d="M 135,160 Q 120,175 125,210 Q 130,250 170,250 L 230,250 Q 270,250 275,210 Q 280,175 265,160 Z" fill="#FFFFFF" stroke="#2D2823" stroke-width="2"/>
  <ellipse cx="200" cy="165" rx="55" ry="14" fill="none" stroke="#2D2823" stroke-width="1.8"/>
  <ellipse cx="200" cy="167" rx="40" ry="9" fill="none" stroke="#A3988E" stroke-width="1.2" stroke-dasharray="2,2"/>
  
  <!-- Projection: 690 mm -->
  <line x1="125" y1="265" x2="275" y2="265" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="125" y1="260" x2="125" y2="270" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="275" y1="260" x2="275" y2="270" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="125,265 133,262 133,268" fill="#7A7067"/>
  <polygon points="275,265 267,262 267,268" fill="#7A7067"/>
  <text x="200" y="280" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600">690 mm Projection</text>

  <!-- Spec Label -->
  <text x="380" y="280" font-family="sans-serif" font-size="8.5" fill="#8C8176" text-anchor="end">SMPL WC-101 | CAD ELEVATION</text>
</svg>
