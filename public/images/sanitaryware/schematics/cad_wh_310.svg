<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FBF9F6"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#E2DACF" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Finished Floor Line (FFL) & Wall Line -->
  <line x1="80" y1="30" x2="80" y2="265" stroke="#4A423B" stroke-width="2.5"/>
  <text x="72" y="50" font-family="sans-serif" font-size="9" fill="#7A7067" text-anchor="end">WALL LINE</text>
  <line x1="60" y1="265" x2="360" y2="265" stroke="#7A7067" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="350" y="260" font-family="sans-serif" font-size="9" fill="#7A7067" text-anchor="end">FFL (FINISHED FLOOR)</text>

  <!-- Mounting Height: 410 mm -->
  <line x1="55" y1="125" x2="55" y2="265" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="50" y1="125" x2="60" y2="125" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="50" y1="265" x2="60" y2="265" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="55,125 52,133 58,133" fill="#7A7067"/>
  <polygon points="55,265 52,257 58,257" fill="#7A7067"/>
  <text x="45" y="200" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600" transform="rotate(-90 45,200)">410 mm</text>

  <!-- Projection: 540 mm -->
  <line x1="80" y1="75" x2="295" y2="75" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="80" y1="70" x2="80" y2="80" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="295" y1="70" x2="295" y2="80" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="80,75 88,72 88,78" fill="#7A7067"/>
  <polygon points="295,75 287,72 287,78" fill="#7A7067"/>
  <text x="187" y="67" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600">540 mm Projection</text>

  <!-- Wall-Hung Pan Profile -->
  <path d="M 80,120 L 255,120 Q 295,120 295,155 Q 295,195 240,225 Q 190,245 130,245 L 80,245 Z" fill="#FFFFFF" stroke="#2D2823" stroke-width="2"/>
  <path d="M 80,115 L 260,115 Q 298,115 298,122 L 80,122 Z" fill="#FFFFFF" stroke="#2D2823" stroke-width="1.5"/>
  <circle cx="80" cy="180" r="16" fill="none" stroke="#7A7067" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="105" y="184" font-family="sans-serif" font-size="9" fill="#7A7067">Ø102 Outlet</text>

  <!-- Flush Plate Sketch above -->
  <rect x="90" y="30" width="35" height="24" rx="2" fill="#FFFFFF" stroke="#7A7067" stroke-width="1.2"/>
  <circle cx="102" cy="42" r="5" fill="none" stroke="#7A7067" stroke-width="1"/>
  <circle cx="114" cy="42" r="3.5" fill="none" stroke="#7A7067" stroke-width="1"/>

  <text x="200" y="280" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600">Width: 360 mm | Bolt Centers: 180 mm</text>
  <text x="380" y="280" font-family="sans-serif" font-size="8.5" fill="#8C8176" text-anchor="end">SMPL WH-310 | CAD ELEVATION</text>
</svg>
