<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FBF9F6"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#E2DACF" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Dimension Lines & Markers -->
  <!-- Top Length: 600 mm -->
  <line x1="70" y1="45" x2="330" y2="45" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="70" y1="40" x2="70" y2="50" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="330" y1="40" x2="330" y2="50" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="70,45 78,42 78,48" fill="#7A7067"/>
  <polygon points="330,45 322,42 322,48" fill="#7A7067"/>
  <text x="200" y="37" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600">600 mm</text>

  <!-- Left Height: 145 mm -->
  <line x1="45" y1="120" x2="45" y2="215" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="40" y1="120" x2="50" y2="120" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="40" y1="215" x2="50" y2="215" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="45,120 42,128 48,128" fill="#7A7067"/>
  <polygon points="45,215 42,207 48,207" fill="#7A7067"/>
  <text x="35" y="172" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600" transform="rotate(-90 35,172)">145 mm</text>

  <!-- Basin Oval Body -->
  <!-- Upper Rim -->
  <ellipse cx="200" cy="125" rx="130" ry="38" fill="#FFFFFF" stroke="#2D2823" stroke-width="2"/>
  <ellipse cx="200" cy="125" rx="114" ry="28" fill="none" stroke="#2D2823" stroke-width="1.5"/>
  <!-- Drain hole -->
  <circle cx="200" cy="125" r="9" fill="#E8E0D5" stroke="#7A7067" stroke-width="1.2"/>
  <circle cx="200" cy="125" r="4" fill="#2D2823"/>

  <!-- Basin Front Curve & Base -->
  <path d="M 70,125 Q 75,190 120,215 L 280,215 Q 325,190 330,125" fill="none" stroke="#2D2823" stroke-width="2"/>
  <line x1="120" y1="215" x2="280" y2="215" stroke="#2D2823" stroke-width="2"/>

  <!-- Width: 400 mm Depth -->
  <text x="200" y="255" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600">400 mm Depth × Thin Rim (5mm)</text>

  <!-- Spec Label -->
  <text x="380" y="280" font-family="sans-serif" font-size="8.5" fill="#8C8176" text-anchor="end">SMPL WB-205 | CAD ELEVATION</text>
</svg>
