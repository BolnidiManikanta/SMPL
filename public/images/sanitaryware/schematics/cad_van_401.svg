<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FBF9F6"/>
  <rect x="10" y="10" width="380" height="280" fill="none" stroke="#E2DACF" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Dimension Lines & Markers -->
  <!-- Width: 900 mm -->
  <line x1="60" y1="40" x2="340" y2="40" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="60" y1="35" x2="60" y2="45" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="340" y1="35" x2="340" y2="45" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="60,40 68,37 68,43" fill="#7A7067"/>
  <polygon points="340,40 332,37 332,43" fill="#7A7067"/>
  <text x="200" y="32" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600">900 mm Width</text>

  <!-- Height: 520 mm -->
  <line x1="45" y1="65" x2="45" y2="235" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="40" y1="65" x2="50" y2="65" stroke="#7A7067" stroke-width="1.2"/>
  <line x1="40" y1="235" x2="50" y2="235" stroke="#7A7067" stroke-width="1.2"/>
  <polygon points="45,65 42,73 48,73" fill="#7A7067"/>
  <polygon points="45,235 42,227 48,227" fill="#7A7067"/>
  <text x="35" y="150" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600" transform="rotate(-90 35,150)">520 mm</text>

  <!-- Ceramic Basin Top -->
  <rect x="60" y="65" width="280" height="22" rx="3" fill="#FFFFFF" stroke="#2D2823" stroke-width="2"/>
  <rect x="110" y="70" width="180" height="12" rx="3" fill="#EFEAE2" stroke="#7A7067" stroke-width="1"/>
  <circle cx="200" cy="76" r="3.5" fill="#2D2823"/>

  <!-- Cabinet Body -->
  <rect x="65" y="87" width="270" height="148" rx="2" fill="#E6DFD5" stroke="#2D2823" stroke-width="2"/>
  <!-- Top Drawer with Fluted Lines -->
  <rect x="70" y="92" width="260" height="68" rx="2" fill="#FAF7F2" stroke="#2D2823" stroke-width="1.5"/>
  <line x1="160" y1="126" x2="240" y2="126" stroke="#9E8552" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Drawer with Fluted Lines -->
  <rect x="70" y="163" width="260" height="68" rx="2" fill="#FAF7F2" stroke="#2D2823" stroke-width="1.5"/>
  <line x1="160" y1="197" x2="240" y2="197" stroke="#9E8552" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Fluting indications -->
  <line x1="85" y1="95" x2="85" y2="157" stroke="#D1C7BA" stroke-width="1"/>
  <line x1="95" y1="95" x2="95" y2="157" stroke="#D1C7BA" stroke-width="1"/>
  <line x1="105" y1="95" x2="105" y2="157" stroke="#D1C7BA" stroke-width="1"/>
  <line x1="295" y1="95" x2="295" y2="157" stroke="#D1C7BA" stroke-width="1"/>
  <line x1="305" y1="95" x2="305" y2="157" stroke="#D1C7BA" stroke-width="1"/>
  <line x1="315" y1="95" x2="315" y2="157" stroke="#D1C7BA" stroke-width="1"/>

  <text x="200" y="260" font-family="sans-serif" font-size="11" fill="#4A423B" text-anchor="middle" font-weight="600">Depth: 480 mm | Blum Soft-Close Runners</text>
  <text x="380" y="280" font-family="sans-serif" font-size="8.5" fill="#8C8176" text-anchor="end">SMPL VAN-401 | CAD ELEVATION</text>
</svg>
